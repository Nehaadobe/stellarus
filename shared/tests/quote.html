<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared quote POC</title>
    <link rel="stylesheet" href="../../styles/styles.css">
    <script type="module" src="./quote.test.js"></script>
  </head>
  <body class="appear">
    <main>
      <h1>Shared quote POC</h1>
      <p id="results" role="status">Running checks...</p>
      <div class="section">
        <div>
          <div class="quote" id="full">
            <div><div><p>We build <strong>better experiences</strong> together.</p></div></div>
            <div><div><p>Alex, <em>Engineering</em></p></div></div>
            <div><div><p><a href="#details">Read the employee story</a></p></div></div>
          </div>
        </div>
        <div>
          <div class="quote" id="single">
            <div><div><p>A quotation without attribution.</p></div></div>
          </div>
        </div>
        <div><div class="quote" id="empty"></div></div>
      </div>
      <div class="section">
        <div>
          <div class="notice" id="notice">
            <div><div><p>Shared Notice with a <a href="#details">working link</a>.</p></div></div>
          </div>
        </div>
        <div><div class="notice" id="notice-empty"></div></div>
      </div>
      <div class="section">
        <div>
          <div class="columns" id="local">
            <div><div><p>Local column one</p></div><div><p>Local column two</p></div></div>
          </div>
        </div>
      </div>
      <p id="details">Shared behavior, independently styled by each site.</p>
    </main>
  </body>
</html>
